# Production stack on the Hetzner VPS. The server's nginx fronts it
# (deploy/nginx-darrida.conf), so the app listens on 127.0.0.1:3040 only.
# Run from this folder, with deploy/.env filled in (see .env.example):
#
#   docker compose -f docker-compose.prod.yml up -d --build      # build and start / update
#   docker compose -f docker-compose.prod.yml run --rm seed      # once: the four designs + settings

name: dar-rida

services:
  db:
    image: postgres:17-alpine
    container_name: dar-rida-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: darrida
      POSTGRES_USER: darrida
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darrida -d darrida"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL in deploy/.env}
    image: dar-rida:latest
    container_name: dar-rida
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://darrida:${POSTGRES_PASSWORD}@db:5432/darrida
      MEDIA_DIR: /app/media
    volumes:
      - media:/app/media
    ports:
      - "127.0.0.1:${HOST_PORT:-3040}:3000"
    depends_on:
      db: { condition: service_healthy }

  # Visitor analytics. Its own `umami` database on the same Postgres (created once:
  #   docker exec dar-rida-db createdb -U darrida umami
  # ). nginx exposes only /stats/script.js and /stats/api/send. The Umami screens
  # stay on the VPS: `ssh -L 3041:127.0.0.1:3041 hetzner`, then http://localhost:3041.
  umami:
    image: umamisoftware/umami:3.4.1
    container_name: dar-rida-umami
    restart: unless-stopped
    ports:
      - "127.0.0.1:3041:3000"
    environment:
      DATABASE_URL: postgres://darrida:${POSTGRES_PASSWORD}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?set UMAMI_APP_SECRET in deploy/.env}
      DISABLE_TELEMETRY: 1
      # nginx sets X-Real-IP to the visitor's address (hashed into a daily id, never stored).
      CLIENT_IP_HEADER: x-real-ip
    depends_on:
      db: { condition: service_healthy }

  # One-off: `docker compose -f docker-compose.prod.yml run --rm seed`
  seed:
    build:
      context: ..
      target: build
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    image: dar-rida-tools:latest
    pull_policy: build
    env_file: .env
    environment:
      DATABASE_URL: postgres://darrida:${POSTGRES_PASSWORD}@db:5432/darrida
      NODE_ENV: production
      MEDIA_DIR: /app/media
    volumes:
      - media:/app/media
    command: ["pnpm", "seed"]
    depends_on:
      db: { condition: service_healthy }
    profiles: [tools]

volumes:
  pgdata:
  media:
