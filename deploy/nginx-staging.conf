# nginx for staging.darrida.net. Install (needs sudo):
#   sudo cp ~/projects/dar-rida-staging/deploy/nginx-staging.conf /etc/nginx/sites-available/darrida-staging
#   sudo ln -s /etc/nginx/sites-available/darrida-staging /etc/nginx/sites-enabled/darrida-staging
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d staging.darrida.net
# certbot then adds the HTTPS block itself.

server {
    listen 80;
    listen [::]:80;
    server_name staging.darrida.net;

    client_max_body_size 20m;

    # Keep staging out of search results.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
}
