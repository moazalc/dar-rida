# nginx for darrida.net on the Hetzner VPS. Install:
#   sudo cp deploy/nginx-darrida.conf /etc/nginx/sites-available/darrida
#   sudo ln -s /etc/nginx/sites-available/darrida /etc/nginx/sites-enabled/darrida
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d darrida.net -d www.darrida.net
# certbot then adds the HTTPS (443) blocks itself. This file is the live copy,
# certbot's blocks included, so later changes are a straight copy + reload.

server {
    server_name darrida.net;

    # Photo uploads in the admin.
    client_max_body_size 20m;

    # Visitor analytics (Umami): only the tracking script and the endpoint it
    # reports to are public. The Umami screens stay on the VPS (ssh tunnel).
    location = /stats/script.js {
        proxy_pass http://127.0.0.1:3041/script.js;
        proxy_set_header Host $host;
    }
    location = /stats/api/send {
        proxy_pass http://127.0.0.1:3041/api/send;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header User-Agent $http_user_agent;
    }

    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: the app reads the visitor's country from it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/darrida.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/darrida.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# www → the bare domain. Inside a location (not a server-level return) so
# certbot's HTTP check still works for www.
server {
    server_name www.darrida.net;

    location / {
        return 301 https://darrida.net$request_uri;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/darrida.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/darrida.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = darrida.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name darrida.net;
    return 404; # managed by Certbot


}
server {
    if ($host = www.darrida.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name www.darrida.net;
    return 404; # managed by Certbot


}