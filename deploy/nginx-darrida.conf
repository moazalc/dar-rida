# nginx for darrida.net on the Hetzner VPS. Install:
#   sudo cp deploy/nginx-darrida.conf /etc/nginx/sites-available/darrida
#   sudo ln -s /etc/nginx/sites-available/darrida /etc/nginx/sites-enabled/darrida
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d darrida.net -d www.darrida.net
# certbot then adds the HTTPS (443) blocks itself.

server {
    listen 80;
    listen [::]:80;
    server_name darrida.net;

    # Photo uploads in the admin.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: the app reads the visitor's country from it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
}

# www → the bare domain. Inside a location (not a server-level return) so
# certbot's HTTP check still works for www.
server {
    listen 80;
    listen [::]:80;
    server_name www.darrida.net;

    location / {
        return 301 https://darrida.net$request_uri;
    }
}
